<g id="projector" fill="#fff" stroke="#111" stroke-width="2"><rect x="-22" y="-13" width="44" height="33" rx="2"/><path d="M-14 1h28M-14 7h28"/><rect x="-13" y="-22" width="26" height="9" rx="1"/><circle cx="0" cy="-17.5" r="3.5" fill="#2452ff"/><path d="M0-23V-31" stroke="#2452ff" stroke-width="2"/><path d="M-4-27L0-32L4-27" fill="none" stroke="#2452ff" stroke-width="2"/></g></defs>
<rect width="760" height="970" fill="#fffdf7"/>
<g fill="#151515" font-family="Arial,sans-serif"><text x="38" y="40" font-size="24" font-weight="700">SAMPLING / PLANTA ESCÉNICA</text><text x="38" y="67" font-size="17">Distribución orientativa · vista superior · sin escala</text></g>

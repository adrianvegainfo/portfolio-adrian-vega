<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 970" role="img" aria-labelledby="title desc">
<title id="title">SAMPLING · planta de investigación escénica</title>
<desc id="desc">Vista superior orientativa. El mylar ocupa aproximadamente el cuarto izquierdo del espacio. P1 y P2 cruzan de izquierda a derecha; P3 y P4 cruzan de derecha a izquierda. Los cuatro proyectores están orientados hacia sus haces amplios y superpuestos. Cuerpo en el centro, cámara y micrófono a la derecha, público frontal y ordenador de control detrás del público. Sin escala.</desc>

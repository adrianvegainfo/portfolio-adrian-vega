<script>
const unpack=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.getElementById('unlock').addEventListener('submit',async event=>{
event.preventDefault();const input=document.getElementById('password'),button=document.getElementById('submit'),status=document.getElementById('error');
button.disabled=true;status.textContent='Abriendo…';
try{if(!crypto.subtle||!window.DecompressionStream)throw new Error('unsupported');
const p=JSON.parse(document.getElementById('encrypted').textContent);
const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unpack(p.salt),iterations:p.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
const compressed=await crypto.subtle.decrypt({name:'AES-GCM',iv:unpack(p.iv)},key,unpack(p.data));
const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
const contents=await new Response(stream).text();const frame=document.getElementById('book');frame.srcdoc=contents;frame.hidden=false;document.getElementById('gate').hidden=true;input.value='';status.textContent='';
}catch(error){status.textContent=error.message==='unsupported'?'Abre este enlace en una versión reciente de Chrome, Edge, Firefox o Safari.':'Contraseña incorrecta. Inténtalo de nuevo.';}finally{button.disabled=false;}
});
</script></body></html>
